services:
  paradedb:
    image: benchmarker-paradedb:pg18.6
    shm_size: ${POSTGRES_SHM_SIZE:-16g}
    build:
      context: ./docker/paradedb
      args:
        PARADEDB_IMAGE: paradedb/paradedb:v0.25.2-pg18
    privileged: true
    cap_add:
      - SYS_ADMIN
    security_opt:
      - seccomp:unconfined
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: benchmark
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 60
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 8G
        reservations:
          cpus: "2"
          memory: 4G
    cpus: 4
    mem_limit: 8g
    command:
      - "postgres"
      - "-c"
      - "shared_preload_libraries=pg_search,pg_cron"
    profiles: [paradedb, all]
    container_name: paradedb
    ports:
      - "5432:5432"
    volumes:
      - paradedb_data:/var/lib/postgresql/18/docker

  pg_textsearch:
    image: benchmarker-pg-textsearch:pg18.6
    shm_size: ${POSTGRES_SHM_SIZE:-16g}
    build:
      context: ./docker/pg_textsearch
      args:
        PG_TEXTSEARCH_VERSION: "1.4.0"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: benchmark
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "test -f /usr/share/postgresql/18/extension/pg_textsearch.control && pg_isready -U postgres",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 8G
        reservations:
          cpus: "2"
          memory: 4G
    cpus: 4
    mem_limit: 8g
    command:
      - "postgres"
      - "-c"
      - "shared_preload_libraries=pg_textsearch"
    profiles: [pg_textsearch, all]
    container_name: pg_textsearch
    ports:
      - "5435:5432"
    volumes:
      - pg_textsearch_data:/var/lib/postgresql/18/docker

  postgres:
    profiles: [postgres, all]
    image: postgres:18.6-bookworm
    shm_size: ${POSTGRES_SHM_SIZE:-16g}
    container_name: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: benchmark
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/docker
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 8G
        reservations:
          cpus: "2"
          memory: 4G
    cpus: 4
    mem_limit: 8g

  elasticsearch:
    profiles: [elasticsearch, all]
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - "ES_JAVA_OPTS=-Xms2g -Xmx2g -XX:+UseG1GC -XX:MaxGCPauseMillis=50"
      - bootstrap.memory_lock=true
      - thread_pool.search.size=4
      - thread_pool.search.queue_size=2000
      - thread_pool.write.size=4
      - indices.memory.index_buffer_size=20%
      - indices.queries.cache.size=20%
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -s http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\"\\|\"status\":\"yellow\"'",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 8G
        reservations:
          cpus: "2"
          memory: 4G
    cpus: 4
    mem_limit: 8g
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536

  opensearch:
    profiles: [opensearch, all]
    image: opensearchproject/opensearch:2.12.0
    container_name: opensearch
    environment:
      - discovery.type=single-node
      - plugins.security.disabled=true
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - "OPENSEARCH_JAVA_OPTS=-Xms2g -Xmx2g"
      - bootstrap.memory_lock=true
    ports:
      - "9201:9200"
      - "9600:9600"
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -s http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\"\\|\"status\":\"yellow\"'",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 8G
        reservations:
          cpus: "2"
          memory: 4G
    cpus: 4
    mem_limit: 8g
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536

  clickhouse:
    profiles: [clickhouse, all]
    image: clickhouse/clickhouse-server:25.12
    container_name: clickhouse
    environment:
      - CLICKHOUSE_DB=benchmark
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=clickhouse
      - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --query 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 8G
        reservations:
          cpus: "2"
          memory: 4G
    cpus: 4
    mem_limit: 8g

  mongodb:
    profiles: [mongodb, all]
    image: mongodb/mongodb-atlas-local
    container_name: mongodb
    environment:
      - DO_NOT_TRACK=1
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 8G
        reservations:
          cpus: "2"
          memory: 4G
    cpus: 4
    mem_limit: 8g

volumes:
  paradedb_data:
  pg_textsearch_data:
  postgres_data:
  elasticsearch_data:
  opensearch_data:
  clickhouse_data:
  mongodb_data:
