x-postgres: &postgres
  environment:
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: postgres
    POSTGRES_DB: benchmark
  shm_size: ${POSTGRES_SHM_SIZE:-16g}
  cpus: ${CPUS:-8}
  mem_limit: ${MEMORY:-32g}
  command: ["postgres", "-c", "shared_buffers=${SHARED_BUFFERS:-24GB}"]
  stop_grace_period: 10m
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d benchmark"]
    interval: 2s
    timeout: 5s
    retries: 150

services:
  paradedb:
    <<: *postgres
    image: benchmarker-paradedb:pg18.6
    build:
      context: ../docker/paradedb
    container_name: ${PROJECT}-paradedb
    command:
      [
        "postgres",
        "-c",
        "shared_buffers=${SHARED_BUFFERS:-24GB}",
        "-c",
        "shared_preload_libraries=pg_search,pg_cron",
      ]
    ports: ["127.0.0.1:${PARADEDB_PORT}:5432"]
    volumes:
      - paradedb_data:/var/lib/postgresql/18/docker

  pg_textsearch:
    <<: *postgres
    image: benchmarker-pg-textsearch:pg18.6
    build:
      context: ../docker/pg_textsearch
    container_name: ${PROJECT}-pg_textsearch
    command:
      [
        "postgres",
        "-c",
        "shared_buffers=${SHARED_BUFFERS:-24GB}",
        "-c",
        "shared_preload_libraries=pg_textsearch",
      ]
    ports: ["127.0.0.1:${PG_TEXTSEARCH_PORT}:5432"]
    volumes:
      - pg_textsearch_data:/var/lib/postgresql/18/docker

  postgres:
    <<: *postgres
    image: postgres:18.6-bookworm
    container_name: ${PROJECT}-postgres
    ports: ["127.0.0.1:${POSTGRES_PORT}:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/docker

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
    container_name: ${PROJECT}-elasticsearch
    cpus: ${CPUS:-8}
    mem_limit: ${MEMORY:-32g}
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.security.http.ssl.enabled: "false"
      ES_JAVA_OPTS: ${ES_JAVA_OPTS:--Xms2g -Xmx2g}
    ports: ["127.0.0.1:${ELASTICSEARCH_PORT}:9200"]
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=1s' >/dev/null",
        ]
      interval: 2s
      timeout: 5s
      retries: 150

volumes:
  paradedb_data:
  pg_textsearch_data:
  postgres_data:
  elasticsearch_data:
